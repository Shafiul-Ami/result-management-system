<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Result – MGM School Result Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>   <!-- common.js fills this -->

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Check Your Result</h1>
        <p>Enter your roll number and date of birth to view your marksheet</p>
      </div>
    </div>

    <div class="container page-body">
      <div class="card no-print" style="max-width:820px;margin:0 auto 24px">
        <form id="result-form" class="form-grid">
          <div class="form-group">
            <label for="rollNo">Roll Number</label>
            <input id="rollNo" name="rollNo" placeholder="e.g. BSC-01" required>
          </div>
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input id="dob" name="dob" type="date" required>
          </div>
          <div class="form-group" style="justify-content:flex-end">
            <button class="btn btn-primary" type="submit">View Result</button>
          </div>
        </form>
      </div>

      <!-- JS puts the marksheet or a message here -->
      <div id="output"></div>
    </div>
  </main>
<div id="footer"></div>
<script src="js/common.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
